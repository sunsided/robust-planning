[package]
name = "robust-planning"
description = "Planning over reachable sets under uncertainty: Robust-RRT and reachability-guided search"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/robust-planning"
readme = "README.md"
keywords = ["planning", "reachability", "robotics", "safety", "rrt"]
categories = ["science::robotics", "algorithms"]

[dependencies]
polyzonotope = "0.2"
sampling-planning = { path = "../sampling-planning", version = "0.0.0" }

[dev-dependencies]
nalgebra = "0.35"
rand_pcg = "0.10.2"

[features]
# Outward rounding in polyzonotope. Safety verdicts are rigorous only with this feature.
# Needs x86-64 Haswell or newer (see .cargo/config.toml) or AArch64.
sound = ["polyzonotope/sound"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
mod_module_files = "deny"
