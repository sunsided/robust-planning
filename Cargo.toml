[package]
name = "robust-planning"
description = "Motion planning over reachable sets under bounded uncertainty: Robust-RRT, Robust RRT* and reachability-guided A* with conservative safety proofs"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/robust-planning"
homepage = "https://sunsided.github.io/planning-and-search/crates/robust-planning/"
readme = "README.md"
keywords = ["motion-planning", "reachability", "zonotope", "rrt", "safety"]
categories = ["science::robotics", "algorithms", "mathematics"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[dependencies]
# The version polyzonotope builds on; needed to construct facet normals for polytopes.
nalgebra = { version = "0.35", default-features = false, features = ["alloc"] }
polyzonotope = "0.4"
# 0.1.1 is the first release on polyzonotope 0.4; 0.1.0 would pull a second copy of the set types.
polyzonotope-reach = { version = "0.1.1", optional = true }
sampling-planning = "0.1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
nalgebra = "0.35"
proptest = "1.12.0"
rand_pcg = "0.10.2"

[[example]]
name = "robust_rrt_current"
required-features = ["reach"]

[[bench]]
name = "search"
harness = false

[[bench]]
name = "robust_rrt_star"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]
# all-features enables `sound`, whose inari dependency needs AVX2 and FMA on x86-64.
rustc-args = ["-C", "target-cpu=haswell"]

[features]
# Outward rounding in polyzonotope. Safety verdicts are rigorous only with this feature.
# Needs x86-64 Haswell or newer (see .cargo/config.toml) or AArch64.
sound = ["polyzonotope/sound", "polyzonotope-reach?/sound"]
# Reach models on polyzonotope-reach: validated continuous-time reachable sets of linear and
# nonlinear dynamics (`models`).
reach = ["dep:polyzonotope-reach"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
