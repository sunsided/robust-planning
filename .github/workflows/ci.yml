# Keep in sync with `task ci` in the Taskfile. Job `name:`s are the required status checks.
# Actions are pinned to commit SHAs (tag in the comment); Dependabot updates them.
# Building jobs check this repository out into robust-planning/ and the unreleased sibling
# sampling-planning (a path dependency) next to it: .github/actions/checkout-siblings.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_NO_TESTS: warn

jobs:
  branch:
    name: branch name
    # Runs on PRs and merge queues (detached HEAD passes) so it can be a required check.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Set BRANCH_FLOW to gitflow for Git Flow repositories (same value as in the Taskfile).
      - run: sh scripts/check-branch.sh "$HEAD_REF" github
        env:
          HEAD_REF: ${{ github.head_ref }}

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: robust-planning
    steps:
      - uses: $/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: robust-planning
    steps:
      - uses: $/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: robust-planning -> target
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  style:
    name: style (separators, README links, typos, mermaid)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No `// ----` separator comments
        run: "! grep -rnE --include='*.rs' --exclude-dir=target --exclude-dir=.git '^[[:space:]]*//+[[:space:]]*[-=*#~_/]{4,}' ."
      - name: Absolute URLs in README files
        run: "! grep -rnoE --include='README.md' --exclude-dir=target --exclude-dir=.git --exclude-dir=review '(\\]\\(|src=\")[^)\"]*' . | grep -vE ':(\\]\\(|src=\")(https?://|#|mailto:)'"
      - name: Typos
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
      # Exact version, resolved via jsdelivr; bump it by hand.
      - name: Mermaid diagrams render
        run: python3 scripts/lint-mermaid.py
        env:
          MMDC: npx --yes @mermaid-js/mermaid-cli@12.2.0
          MMDC_NO_SANDBOX: "1"

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings --html-in-header ${{ github.workspace }}/robust-planning/docs/mermaid.html
    defaults:
      run:
        working-directory: robust-planning
    steps:
      - uses: $/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: robust-planning -> target
      - run: cargo doc --workspace --all-features --no-deps --document-private-items

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Platform-independent code; macOS/Windows minutes are costly on a private repo.
        # `sound` (inari) needs AVX2 and FMA, which the Linux x86-64 runners have.
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: robust-planning
    steps:
      - uses: $/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: robust-planning -> target
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features
      # Remove for binary-only crates (no library target, no doctests).
      - run: cargo test --workspace --all-features --doc

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: robust-planning
    steps:
      - uses: $/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: robust-planning -> target
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          working-directory: robust-planning
          files: lcov.info
          fail_ci_if_error: true
          # OIDC everywhere except fork PRs, which get no id-token and upload tokenless instead.
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: robust-planning
    steps:
      - uses: $/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features
          manifest-path: robust-planning/Cargo.toml

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: robust-planning
    steps:
      - uses: $/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-hack
      # Library only: dev-dependencies (criterion, proptest) need a newer Rust than users do.
      - run: cargo hack check --rust-version --workspace --ignore-private --all-features

  # Baseline: the published 0.0.0 placeholder on crates.io.
  semver:
    name: semver
    if: github.event_name == 'pull_request'
    env:
      # The action runs cargo from the workspace root, outside robust-planning/.cargo, and the
      # heuristic feature group enables `sound`, whose inari dependency needs AVX2 and FMA.
      RUSTFLAGS: -C target-cpu=haswell
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: robust-planning
    steps:
      - uses: $/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          manifest-path: robust-planning/Cargo.toml
