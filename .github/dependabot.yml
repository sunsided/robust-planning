# One block per ecosystem; within each, majors and minor/patch updates are separate groups, so a
# breaking upgrade never hides inside a routine bump. Commit subjects get an ecosystem prefix
# ("Cargo: Bump ...") instead of Conventional Commits prefixes (no "deps:", "chore:").
# cooldown follows zizmor's dependabot-cooldown recommendation (7 days); raise it if the repo's
# zizmor config demands more. Add docker / npm blocks with the same settings if the repo grows them.
version: 2
updates:
  # Cargo updates fail (path_dependencies_not_reachable) until sampling-planning, a path
  # dependency on a private sibling, has a real crates.io release and drops its `path`.
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: Cargo
    groups:
      cargo-major:
        update-types: [major]
      cargo-minor-patch:
        update-types: [minor, patch]

  # The local composite action is not under .github/workflows, so list it explicitly.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/checkout-siblings"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: Actions
    groups:
      actions-major:
        update-types: [major]
      actions-minor-patch:
        update-types: [minor, patch]
